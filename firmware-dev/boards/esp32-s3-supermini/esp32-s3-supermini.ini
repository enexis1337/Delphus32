; PlatformIO Project Configuration File
;
; ESP32-S3 SuperMini (headless port)
;
; Hardware:
;   - ESP32-S3FH4R2 (4MB quad flash + 2MB quad PSRAM) or FIF/N8/N8R8 variants
;   - On-board WS2812 RGB LED on GPIO48
;   - Native USB-Serial/JTAG (no USB-OTG on breakout, so no USB HID/BadUSB)
;   - No display -> headless: control via Serial CLI and WebUI
;
; This port intentionally provides no button wiring (fully headless).

[env:esp32-s3-supermini]
board = esp32-s3-supermini
board_build.arduino.memory_type = qio_qspi ; quad PSRAM (2MB) of the FH4R2
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/esp32-s3-supermini>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}

	-Iboards/esp32-s3-supermini

	-DDEVICE_NAME='"ESP32-S3 SuperMini"'

	; CH9329 serial BadUSB module (user wired to the I2C/Grove pins)
	-DBAD_TX=GROVE_SDA
	-DBAD_RX=GROVE_SCL

	; grove pins
	-DGROVE_SDA=8
	-DGROVE_SCL=9

	; infrared led pin
	-DIR_TX_PINS='{{"GPIO 2", 2}, {"GPIO 8", 8}, {"GPIO 9", 9}}'
	-DIR_RX_PINS='{{"GPIO 2", 2}, {"GPIO 8", 8}, {"GPIO 9", 9}}'
	-DTXLED=2
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	; radio frequency (one pin modules)
	-DRF_TX_PINS='{{"GPIO 8", 8}, {"GPIO 9", 9}}'
	-DRF_RX_PINS='{{"GPIO 8", 8}, {"GPIO 9", 9}}'

	; no SD card on the SuperMini
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

	; no display (headless)
	-DFP=1
	-DFM=2
	-DFG=3

	; CC1101 SPI connection pins (user wired module)
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=9
	-DCC1101_SS_PIN=10
	-DCC1101_MOSI_PIN=11
	-DCC1101_SCK_PIN=12
	-DCC1101_MISO_PIN=13

	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=10

lib_deps =
	${env.lib_deps}

; keep FastLED for the WS2812, drop heavy audio libs to fit 4MB flash
lib_ignore =
	ESP8266Audio
	ESP8266SAM